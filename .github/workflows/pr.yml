# Checks that read pull request metadata (title, branch, and so on) rather than code. They run on
# `edited`, which a title or body edit fires, so they stay out of ci.yml: an edit there would restart
# the full CI run. Put a new metadata check here, as a step in Metadata or as a job of its own that
# the ruleset also requires.
name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # Every run judges the same PR state, so a newer one may cancel an older one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Metadata
    runs-on: ubuntu-24.04
    # pull-requests lets check:pr list the other open PRs' files through gh; a job-level block
    # replaces the workflow's, so contents stays.
    permissions:
      contents: read
      pull-requests: read
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checked-out merge commit and its first parent (the base), so check:pr can diff them.
          fetch-depth: 2
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_DIFF_BASE: HEAD^1
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: pnpm check:pr
