name: Issue milestone

on:
  issues:
    types: [opened, edited, demilestoned, labeled, unlabeled, milestoned]

permissions:
  contents: read
  issues: write

jobs:
  milestone:
    name: Milestone
    if: contains(fromJSON('["opened","edited","demilestoned"]'), github.event.action)
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm check:issue

  parent:
    name: Parent
    if: >-
      github.event.action == 'opened' || github.event.action == 'milestoned' ||
      (github.event.action == 'labeled' && startsWith(github.event.label.name, 'area:'))
    runs-on: ubuntu-24.04
    # Serialises events for one issue, so a label and a milestone set together post one comment.
    concurrency:
      group: issue-parent-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm check:parent

  labels:
    name: Labels
    if: >-
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      (startsWith(github.event.label.name, 'ready-for-') ||
      startsWith(github.event.label.name, 'priority:') ||
      github.event.label.name == 'bug' || github.event.label.name == 'enhancement')
    runs-on: ubuntu-24.04
    # Serialises events for one issue, so a multi-label edit posts at most one comment.
    concurrency:
      group: issue-labels-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm check:labels
