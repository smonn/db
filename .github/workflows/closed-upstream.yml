name: Closed upstream references

# Fails when an open issue cites another repository's issue or pull request that has since closed (#699).
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  upstream:
    name: Upstream
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm check:upstream
