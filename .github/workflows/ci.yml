name: CI

on:
  pull_request:
    # edited re-runs CI when the title or base changes. A body-only edit skips every job.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A body-only edit gets its own group, so it can't cancel the run on the PR's head.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base && 'body-edit' || 'ci' }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base) }}
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
      - run: pnpm format:check
      - run: pnpm check:docs

  mermaid:
    name: Mermaid
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
      - run: pnpm check:mermaid

  typecheck:
    name: Typecheck
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base) }}
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
      - run: pnpm typecheck

  lint:
    name: Lint
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base) }}
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
      - run: pnpm lint
      - run: pnpm lint:actions -color
      - run: pnpm check:imports
      - run: pnpm check:index
      - run: pnpm check:node-version
      - run: pnpm knip
      - run: pnpm deps
      - run: pnpm fta

  test:
    name: Test
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base) }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
      - run: pnpm coverage

  pr:
    name: PR
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base) }}
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
      # Skips the step, not the job, so Required still sees success on pushes to main.
      - if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: pnpm check:pr

  # The main ruleset requires only this job, so adding or renaming a job needs no ruleset change.
  required:
    name: Required
    if: ${{ always() && !(github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base) }}
    needs: [docs, mermaid, typecheck, lint, test, pr]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
