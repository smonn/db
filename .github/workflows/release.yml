name: Release

on:
  push:
    branches: [main]

# Each job grants itself only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  # Install and build run dependency code, so this job gets no id-token and Publish takes only its tarball.
  pack:
    name: Pack
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache (no pnpm store restore). pnpm/setup still restores and saves its lockfile verification cache, whatever the cache input says.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      # prepack builds dist/.
      - run: pnpm pack --out "$RUNNER_TEMP/package.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package.tgz
          if-no-files-found: error

  # scripts/check-oidc-jobs.ts holds this job to this exact text: no checkout, no install, no scripts, no outputs from Pack.
  publish:
    name: Publish
    needs: pack
    runs-on: ubuntu-24.04
    permissions:
      # npm trusted publishing exchanges the OIDC token for a publish token.
      id-token: write
    steps:
      # Pack's code chose the artifact's contents. pnpm reads .npmrc, package.json, and pnpm-workspace.yaml from the cwd and its parents, so keep the artifact out of both.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pkg
      # No package.json here, so pin the pnpm version pnpm-lock.yaml resolves, and install no runtime.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.15.0
          install: false
      # Publish a regular file from an empty dir. Stays staged until a maintainer runs `pnpm stage approve` with 2FA. No repo is checked out, so skip the git checks.
      - run: |
          test -f "$RUNNER_TEMP/pkg/package.tgz"
          test ! -L "$RUNNER_TEMP/pkg/package.tgz"
          empty=$(mktemp -d)
          cd "$empty"
          pnpm stage publish --ignore-scripts --no-git-checks "$RUNNER_TEMP/pkg/package.tgz"
